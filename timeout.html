<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timeout and TimeInterval</title>
    <link rel="stylesheet" href="/src/css/example.css" />
    <script src="/src/js/main.js" defer></script>
  </head>
  <body>
    <h1 id="countdown">Timeout and TimeInterval</h1>
    <button id="startButton">Start Countdown</button>

    <div class="timer-wrap">
      <div class="input-row">
        <label for="customTime">Start time (seconds)</label>
        <input type="number" id="customTime" min="1" max="3600" value="10" />
      </div>

      <div class="progress-bar-bg">
        <div
          class="progress-bar-fill"
          id="progressBar"
          style="width: 100%"
        ></div>
      </div>

      <div class="timer-display" id="countdownDisplay">10</div>

      <div class="btn-row">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn">Reset</button>
      </div>

      <p id="statusMsg">Enter a time and press Start</p>
    </div>
  </body>
</html>
